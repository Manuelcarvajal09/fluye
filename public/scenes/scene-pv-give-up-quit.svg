<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><title>Un boxeador agotado lanza la toalla al aire en el ring: se rinde</title><style>.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}.wave{animation:wave 1.1s ease-in-out infinite alternate}.bob{animation:bob 3.4s ease-in-out infinite}.nod{animation:nod 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.float{animation:float 3.2s ease-in-out infinite}.steam{animation:steam 2.6s ease-out infinite}.fall{animation:fall 7s linear infinite}.spin{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.drive{animation:drive 6s ease-in-out infinite alternate}.drip{animation:drip 1.5s ease-in infinite}.mascot-blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}.mascot-tail{animation:wag 1.4s ease-in-out infinite}.mascot-ears{animation:ears 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.mascot-wave-l{animation:wave 0.7s ease-in-out infinite alternate}.mascot-twinkle{animation:twinkle 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:.6s}.d2{animation-delay:1.3s}.d3{animation-delay:2.1s}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes nod{0%,84%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}95%{transform:rotate(3deg)}}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(250px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@keyframes drip{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(13px);opacity:0}}@keyframes drive{from{transform:translateX(-4px)}to{transform:translateX(4px)}}@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes ears{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="c"><rect width="400" height="240" rx="22"/></clipPath></defs><g clip-path="url(#c)"><rect width="400" height="240" fill="#e6e1fb"/><rect width="400" height="240" fill="#3a3566"/><ellipse cx="200" cy="60" rx="180" ry="120" fill="#fff" opacity=".12"/><path d="M44 0h32l22 60h-76z" fill="#fff" opacity=".08"/><path d="M184 0h32l22 60h-76z" fill="#fff" opacity=".08"/><path d="M324 0h32l22 60h-76z" fill="#fff" opacity=".08"/><rect y="196" width="400" height="44" fill="#6a55e0"/><rect y="196" width="400" height="8" fill="#8f80e8"/><rect x="20" y="84" width="14" height="116" rx="5" fill="#e8495a"/><rect x="366" y="84" width="14" height="116" rx="5" fill="#8fd0f7"/><path d="M34 104h332" stroke="#fff" stroke-width="5" opacity=".85"/><path d="M34 136h332" stroke="#fff" stroke-width="5" opacity=".85"/><path d="M34 168h332" stroke="#fff" stroke-width="5" opacity=".85"/><g class="float"><g transform="rotate(-16 236 62)"><path d="M212 44h48v34q-12 6 -24 0t-24 0z" fill="#fff"/><path d="M212 52h48" stroke="#8fd0f7" stroke-width="4"/></g></g><path class="twinkle" d="M200 96q8 -14 22 -18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/><ellipse cx="170" cy="216" rx="28" ry="4.48" fill="#1a1024" opacity="0.25"/><g transfo