<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><title>Una persona relajada en el sillón pospone su tarea: en el calendario, una flecha la mueve a otro día junto a un reloj</title><style>.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}.wave{animation:wave 1.1s ease-in-out infinite alternate}.bob{animation:bob 3.4s ease-in-out infinite}.nod{animation:nod 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.float{animation:float 3.2s ease-in-out infinite}.steam{animation:steam 2.6s ease-out infinite}.fall{animation:fall 7s linear infinite}.spin{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.drive{animation:drive 6s ease-in-out infinite alternate}.drip{animation:drip 1.5s ease-in infinite}.mascot-blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}.mascot-tail{animation:wag 1.4s ease-in-out infinite}.mascot-ears{animation:ears 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.mascot-wave-l{animation:wave 0.7s ease-in-out infinite alternate}.mascot-twinkle{animation:twinkle 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:.6s}.d2{animation-delay:1.3s}.d3{animation-delay:2.1s}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes nod{0%,84%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}95%{transform:rotate(3deg)}}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframe