<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><title>Un auto con el cofre abierto echa humo en la carretera; su dueño se lleva las manos a la cabeza junto a un triángulo de advertencia</title><style>.blink{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}.wave{animation:wave 1.1s ease-in-out infinite alternate}.bob{animation:bob 3.4s ease-in-out infinite}.nod{animation:nod 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}.sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.float{animation:float 3.2s ease-in-out infinite}.steam{animation:steam 2.6s ease-out infinite}.fall{animation:fall 7s linear infinite}.spin{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.drive{animation:drive 6s ease-in-out infinite alternate}.drip{animation:drip 1.5s ease-in infinite}.mascot-blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}.mascot-tail{animation:wag 1.4s ease-in-out infinite}.mascot-ears{animation:ears 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.mascot-wave-l{animation:wave 0.7s ease-in-out infinite alternate}.mascot-twinkle{animation:twinkle 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:.6s}.d2{animation-delay:1.3s}.d3{animation-delay:2.1s}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes nod{0%,84%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}95%{transform:rotate(3deg)}}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(250px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@keyframes drip{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(13px);opacity:0}}@keyframes drive{from{transform:translateX(-4px)}to{transform:translateX(4px)}}@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes ears{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="c"><rect width="400" height="240" rx="22"/></clipPath></defs><g clip-path="url(#c)"><rect width="400" height="240" fill="#d8f3f5"/><rect width="400" height="150" fill="#d8f3f5"/><path d="M0 140C70 118 150 126 230 142C300 156 350 140 400 132V240H0Z" fill="#b6ebd0"/><path d="M0 178C110 160 240 176 400 164V240H0Z" fill="#22c79a"/><path d="M0 214C120 204 280 214 400 206V240H0Z" fill="#1ab58a"/><g class="float"><g transform="translate(70 36) scale(0.8)" fill="#fff" opacity=".9"><circle cx="-16" cy="0" r="11"/><circle cx="0" cy="-7" r="15"/><circle cx="17" cy="0" r="12"/><rect x="-27" y="-2" width="56" height="13" rx="6.500"/></g></g><g transform="translate(40 180) scale(1)"><ellipse cx="0" cy="0" rx="24" ry="3.84" fill="#1a1024" opacity="0.12"/><path d="M-7 0C-5 -16 -6 -30 -4 -46L4 -46C6 -30 5 -16 7 0Z" fill="#9a6a3e"/><path d="M1 0C2 -16 1 -30 2 -46L4 -46C6 -30 5 -16 7 0Z" fill="#7d5330"/><path d="M-3 -34C-10 -40 -16 -46 -20 -54M3 -38C10 -44 14 -50 18 -58" fill="none" stroke="#9a6a3e" stroke-width="5" stroke-linecap="round"/><g class="sway"><circle cx="16" cy="-58" r="24" fill="#0d7b5b"/><circle cx="-18" cy="-56" r="23" fill="#0d7b5b"/><circle cx="0" cy="-78" r="28" fill="#0a8f65"