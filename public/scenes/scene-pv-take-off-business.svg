);opacity:0}30%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(250px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@keyframes drip{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(13px);opacity:0}}@keyframes drive{from{transform:translateX(-4px)}to{transform:translateX(4px)}}@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes ears{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="c"><rect width="400" height="240" rx="22"/></clipPath></defs><g clip-path="url(#c)"><rect width="400" height="240" fill="#e2f6ee"/><rect width="400" height="176" fill="#dbf3e8"/><g class="float"><g transform="translate(60 34) scale(0.7)" fill="#fff" opacity=".9"><circle cx="-16" cy="0" r="11"/><circle cx="0" cy="-7" r="15"/><circle cx="17" cy="0" r="12"/><rect x="-27" y="-2" width="56" height="13" rx="6.500"/></g></g><rect y="190" width="400" height="50" fill="#c4e8d7"/><rect y="190" width="400" height="6" fill="#1a1024" opacity=".06"/><rect x="20" y="92" width="124" height="98" fill="#fff8ee"/><path d="M12 70h140l10 26a12 12 0 0 1 -24 0a12 12 0 0 1 -24 0a12 12 0 0 1 -24 0a12 12 0 0 1 -24 0a12 12 0 0 1 -24 0a12 12 0 0 1 -24 0a12 12 0 0 1 -20 4z" fill="#ff8fa8"/><rect x="34" y="118" width="46" height="40" rx="5" fill="#cfeaff"/><rect x="94" y="118" width="36" height="72" rx="5" fill="#6a55e0"/><circle cx="102" cy="156" r="3" fill="#ffb347"/><rect x="212" y="26" width="168" height="130" rx="12" fill="#fff"/><rect x="228" y="122" width="18" height="18" rx="5" fill="#b9adf7"/><rect x="256" y="112" width="18" height="28" rx="5" fill="#8fd0f7"/><rect x="284" y="100" width="18" height="40" rx="5" fill="#22c79a"/><rect x="312" y="78