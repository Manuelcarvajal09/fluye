name: CI
on:
  pull_request:
  push:
    branches: [main]
# Sin secretos ni despliegues: es seguro para PRs de terceros.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run content
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
